<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="ChickenRun - a fun chicken shooting game for kids." />
    <title>ChickenRun</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="timer">01 : 30</div>
        <div id="score">0</div>
        <div id="challenge-progress" class="hidden">Classic</div>
      </div>
      <button id="pause-btn" class="pause-btn" type="button" aria-label="Pause" title="Pause (Esc)">
        <span class="pause-icon" aria-hidden="true"></span>
      </button>
      <button id="mute-btn" class="mute-btn" type="button" aria-label="Sound on (tap to mute)" aria-pressed="false" title="Sound">
        <svg class="mute-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path class="spk" d="M3 9.5v5h4l5 4v-13l-5 4z" fill="#fff" />
          <path class="wave w1" d="M15.5 9a4.5 4.5 0 0 1 0 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
          <path class="wave w2" d="M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />
          <path class="cross" d="M15.5 9.5l6 5M21.5 9.5l-6 5" fill="none" stroke="#ff8a7a" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </button>
      <div id="ammo"></div>
      <button id="reload-btn" type="button">Reload</button>
      <div id="toast" class="toast hidden" role="status"></div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <div class="menu-splash" aria-hidden="true"></div>
          <div class="menu-head">
            <h1>ChickenRun</h1>
            <p class="tagline">Catch the crazy chickens!</p>
          </div>
          <p id="overlay-msg">Pick a game and start hunting!</p>
          <div class="views" id="views" data-dir="fwd">
            <button id="back-btn" type="button" class="back-btn" hidden>← Back</button>
            <div id="mode-list" class="mode-list" aria-label="Games"></div>
            <div id="challenge-list" class="challenge-list" aria-label="Challenges" hidden></div>
          </div>
          <p id="high-score-line">🏅 Best score: <strong id="high-score">0</strong></p>
        </div>
      </div>
      <div id="pause-overlay" class="overlay pause-overlay hidden" role="dialog" aria-modal="true" aria-label="Game paused" aria-hidden="true" inert>
        <div class="panel pause-panel">
          <h2>Paused</h2>
          <p id="pause-info" class="pause-info">Score 0 · Time 01:30</p>
          <div class="pause-actions">
            <button id="resume-btn" type="button" class="pbtn pbtn-primary">▶ Resume</button>
            <button id="restart-btn" type="button" class="pbtn">↻ Restart</button>
            <button id="quit-btn" type="button" class="pbtn pbtn-quit">✕ Quit to menu</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
