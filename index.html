<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ChikenRun</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="timer">01 : 30</div>
        <div id="score">0</div>
      </div>
      <div id="ammo"></div>
      <button id="reload-btn" type="button" hidden>Naloži</button>
      <div id="overlay" class="overlay">
        <div class="panel">
          <h1>ChikenRun</h1>
          <p class="tagline">Lovi lude kokoši!</p>
          <p id="overlay-msg">Klikni ali tapni, da ustreliš.</p>
          <p id="high-score-line">Najboljši rezultat: <strong id="high-score">0</strong></p>
          <button id="start-btn" type="button">Začni</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
