<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ChickenRun</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="timer">01 : 30</div>
        <div id="score">0</div>
        <div id="challenge-progress" class="hidden">Klasično</div>
      </div>
      <div id="ammo"></div>
      <button id="reload-btn" type="button" hidden>Naloži</button>
      <div id="toast" class="toast hidden" role="status"></div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <div class="menu-splash" aria-hidden="true"></div>
          <div class="menu-head">
            <h1>ChickenRun</h1>
            <p class="tagline">Lovi lude kokoši!</p>
          </div>
          <p id="overlay-msg">Izberi igro in lovi!</p>
          <button id="back-btn" type="button" class="back-btn" hidden>← Nazaj</button>
          <div id="mode-list" class="mode-list" aria-label="Igre"></div>
          <div id="challenge-list" class="challenge-list" aria-label="Izzivi" hidden></div>
          <p id="high-score-line">🏅 Najboljši rezultat: <strong id="high-score">0</strong></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
